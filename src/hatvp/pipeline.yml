version: 1
runtime:
  hatvp_prefix: hatvp
  hatvp_xml_url: https://www.hatvp.fr/livraison/merge/declarations.xml
  hatvp_csv_url: https://www.hatvp.fr/livraison/opendata/liste.csv
  hatvp_bigquery_dataset: hatvp
  hatvp_bigquery_location: europe-west1
  pipeline_version: 0.1.0
  user_agent: YAHATVP-ingestion/0.1 (+https://github.com/louispaulet/YAHATVP)
  download_connect_timeout_seconds: 15.0
  download_read_timeout_seconds: 180.0
  download_retries: 3
  person_dob_max_age_years: 100
parser:
  xml_root: declarations
  allowed_top_level_children: [declaration, declarations]
  sections:
    income: revenuMandatDto
    mandate: mandatElectifDto
    liabilities: passifDto
    activities:
      - activConsultantDto
      - activProfCinqDerniereDto
      - activProfConjointDto
      - fonctionBenevoleDto
      - activCollaborateursDto
    income_activities:
      - activProfCinqDerniereDto
    participations: [participationDirigeantDto, participationFinanciereDto]
    assets:
      - immeubleDto
      - sciDto
      - valeursNonEnBourseDto
      - valeursEnBourseDto
      - assuranceVieDto
      - comptesBancaireDto
      - bienDiverDto
      - vehiculeDto
      - fondDto
      - autreBienDto
      - bienEtrangerDto
  field_candidates:
    asset_value: [valeur, evaluation, valeurActuelle, valeurRachat, valeurVenale, prixAcquisition, valeurAchat]
    asset_name: [nature, nomSociete, denomination, typeCompte, marque, souscripteur, etablissement, localisation, description]
    activity_description: [description, activite, activiteProf, label]
    activity_employer: [employeur, employeurConjoint, nomEmployeur]
    participation_company: [nomSociete, denomination]
    liability_value: [restantDu, mensualite, valeur, montant]
    liability_description: [objetDette, nature, nomCreancier, description]
  csv:
    delimiter: ";"
    identity_columns: [id_origine, url_dossier]
